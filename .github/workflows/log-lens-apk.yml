name: Log Lens APK (companion app)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. log-lens-v0.1.0)'
        required: true
        default: 'log-lens-v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/log_lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/log-lens-${{ inputs.tag }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: companion/log_lens/release/log-lens-${{ inputs.tag }}.apk
          generate_release_notes: false
          body: |
            Companion log-monitoring app for remote debugging — temporary build hosted in
            the ice-bros repo until the dedicated `log-lens` repo gets CI access.
